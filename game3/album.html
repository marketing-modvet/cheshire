<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Duel 3 — Альбом карт</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a0a2e;
    color: #fff;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.8em;
    letter-spacing: 2px;
    color: #f0c060;
    text-shadow: 0 0 18px rgba(240,192,96,0.4);
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 0.85em;
    margin-bottom: 8px;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-bottom: 30px;
    font-size: 0.85em;
  }
  .back-link a { color: #a08cff; text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }

  .section-title {
    max-width: 1100px;
    margin: 36px auto 14px;
    font-size: 1rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 8px;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
  }

  .card-tile {
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    text-align: center;
  }
  .card-tile:hover {
    transform: translateY(-4px);
    border-color: rgba(240,192,96,0.5);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .card-tile img {
    width: 100%;
    display: block;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #000;
  }
  .card-tile .label {
    font-size: 0.72rem;
    padding: 6px 4px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.5px;
  }
  .card-tile.special .label { color: #e0be55; font-weight: 700; }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 30px;
  }
  #lightbox.visible { display: flex; }
  #lightbox img {
    max-width: min(90vw, 600px);
    max-height: 88vh;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 16px 80px rgba(0,0,0,0.8);
  }
  #lightbox .lb-caption {
    position: absolute;
    bottom: 26px;
    left: 0; right: 0;
    text-align: center;
    color: #f0c060;
    font-size: 1rem;
    letter-spacing: 1px;
  }
  #lightbox .lb-close {
    position: absolute;
    top: 18px; right: 26px;
    font-size: 1.8rem;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
  }
  #lightbox .lb-close:hover { color: #fff; }
  #lightbox .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.2rem;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    padding: 10px 16px;
    user-select: none;
  }
  #lightbox .lb-nav:hover { color: #fff; }
  #lb-prev { left: 6px; }
  #lb-next { right: 6px; }
</style>
</head>
<body>

<h1>🃏 Альбом карт — Card Duel 3</h1>
<p class="subtitle">46 карт · нажмите на карту, чтобы посмотреть в полном размере</p>
<p class="back-link"><a href="index.html">← Вернуться в игру</a></p>

<div class="section-title">Числовые карты (1–10, масти A / B / C / D)</div>
<div class="grid" id="grid-numbers"></div>

<div class="section-title">Специальные карты</div>
<div class="grid" id="grid-specials"></div>

<div id="lightbox" onclick="closeLightbox(event)">
  <span class="lb-close" onclick="closeLightbox(event)">✕</span>
  <span class="lb-nav" id="lb-prev" onclick="navLightbox(event,-1)">‹</span>
  <img id="lb-img" src="" alt="">
  <span class="lb-nav" id="lb-next" onclick="navLightbox(event,1)">›</span>
  <div class="lb-caption" id="lb-caption"></div>
</div>

<script>
const SPECIAL_NAMES = { A: 'Атака', S: 'Щит', L: 'Удача' };

// Build the same card set the game uses
const cards = [];
const suits = ['A','B','C','D'];
for (let v = 1; v <= 10; v++) {
  suits.forEach(s => cards.push({ id: `${v}${s}`, img: `cards/${v}${s}.jpg`, label: `${v} (масть ${s})`, special: false }));
}
['A1','A2','S1','S2','L1','L2'].forEach(id => {
  const type = id[0];
  cards.push({ id, img: `cards/${id}.jpg`, label: `${SPECIAL_NAMES[type]} ${id[1]}`, special: true });
});

const numberCards = cards.filter(c => !c.special);
const specialCards = cards.filter(c => c.special);

function renderGrid(containerId, list) {
  const el = document.getElementById(containerId);
  el.innerHTML = list.map((c, i) => `
    <div class="card-tile${c.special ? ' special' : ''}" onclick="openLightbox('${c.list}', ${c.idx})">
      <img src="${c.img}" alt="${c.label}" loading="lazy">
      <div class="label">${c.label}</div>
    </div>
  `).join('');
}

// tag each card with its list name + index for lightbox nav
numberCards.forEach((c, i) => { c.list = 'numbers'; c.idx = i; });
specialCards.forEach((c, i) => { c.list = 'specials'; c.idx = i; });

renderGrid('grid-numbers', numberCards);
renderGrid('grid-specials', specialCards);

let currentList = null, currentIdx = 0;

function openLightbox(listName, idx) {
  currentList = listName === 'numbers' ? numberCards : specialCards;
  currentIdx = idx;
  showLightbox();
}

function showLightbox() {
  const c = currentList[currentIdx];
  document.getElementById('lb-img').src = c.img;
  document.getElementById('lb-img').alt = c.label;
  document.getElementById('lb-caption').textContent = c.label;
  document.getElementById('lightbox').classList.add('visible');
}

function closeLightbox(e) {
  if (e && e.target.id !== 'lightbox' && e.target.className !== 'lb-close') return;
  document.getElementById('lightbox').classList.remove('visible');
}

function navLightbox(e, dir) {
  e.stopPropagation();
  currentIdx = (currentIdx + dir + currentList.length) % currentList.length;
  showLightbox();
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('visible')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(e, -1);
  if (e.key === 'ArrowRight') navLightbox(e, 1);
});
</script>
</body>
</html>
