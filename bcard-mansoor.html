<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mansoor Al Shiha — Vet Alliance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root {
      --teal: #015b63;
      --teal-light: #01767f;
      --teal-dark: #013f45;
      --mint: #d6eacd;
      --mint-soft: #e8f3e2;
      --cream: #fafdf8;
      --navy: #182046;
      --white: #ffffff;
      --gray: #6b7280;
      --gray-light: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(145deg, #f0f5ed 0%, #e2ece0 40%, #d4e4d0 100%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: 20px;
      border-radius: 20px;
      overflow: hidden;
      background: var(--white);
      box-shadow:
        0 4px 6px -1px rgba(1, 91, 99, 0.06),
        0 20px 50px -12px rgba(1, 91, 99, 0.15),
        0 0 0 1px rgba(1, 91, 99, 0.04);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Header ── */
    .header {
      position: relative;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 50%, var(--teal) 100%);
      padding: 32px 24px 28px;
      text-align: center;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -60px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -30px; left: -20px;
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.06);
    }

    .logo {
      width: 80px;
      height: auto;
      margin-bottom: 18px;
      filter: brightness(0) invert(1);
      opacity: 0.92;
      animation: logoIn 0.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 0.92; transform: scale(1); }
    }

    .name {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--white);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      animation: textIn 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .title {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.78);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      animation: textIn 0.6s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Wave ── */
    .wave { display: block; width: 100%; margin-top: -1px; line-height: 0; }
    .wave svg { display: block; width: 100%; height: auto; }

    /* ── Body ── */
    .body { padding: 20px 24px 8px; }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--navy);
      font-size: 14px;
      font-weight: 400;
      transition: all 0.25s ease;
      position: relative;
      animation: itemIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .contact-item:nth-child(1) { animation-delay: 0.45s; }
    .contact-item:nth-child(2) { animation-delay: 0.5s; }
    .contact-item:nth-child(3) { animation-delay: 0.55s; }
    .contact-item:nth-child(4) { animation-delay: 0.6s; }

    @keyframes itemIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .contact-item:hover { background: var(--mint-soft); transform: translateX(4px); }

    .contact-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--mint-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .contact-item:hover .contact-icon { background: var(--mint); }
    .contact-icon svg { width: 18px; height: 18px; color: var(--teal); }

    .contact-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--gray);
      font-weight: 500;
      margin-bottom: 1px;
    }
    .contact-value { color: var(--navy); font-size: 14px; font-weight: 500; }

    .wa-badge {
      margin-left: auto;
      background: #25D366;
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .wa-badge:hover { background: #1ebe5d; transform: scale(1.05); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gray-light), transparent);
      margin: 8px 24px 16px;
    }

    /* ── Socials ── */
    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-bottom: 24px;
      animation: itemIn 0.5s 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .social-link {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--cream);
      border: 1px solid var(--gray-light);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .social-link:hover {
      background: var(--teal);
      border-color: var(--teal);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(1, 91, 99, 0.25);
    }
    .social-link svg { width: 18px; height: 18px; color: var(--teal); transition: color 0.3s ease; }
    .social-link:hover svg { color: var(--white); }

    .footer {
      text-align: center;
      padding: 0 24px 20px;
      font-size: 11px;
      color: var(--gray);
      opacity: 0.7;
    }
  </style>
</head>
<body>

</body>
