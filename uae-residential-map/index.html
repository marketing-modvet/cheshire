<style>
:root{--navy:#0f3d64;--coral:#ef6c4d;--tq:#14aecb;--lb:#eaf4fb;--mut:#5b7388}

#app{display:flex;height:100%}

header p{margin:3px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.stats{display:flex;gap:8px;padding:10px 12px;background:var(--lb)}
.stat{flex:1;background:#fff;border-radius:8px;padding:8px 10px;border-left:4px solid var(--c)}

.ctrl{padding:10px 12px;border-bottom:1px solid #e3edf4}
.ctrl input[type=search]{width:100%;padding:9px 11px;border:1px solid #c7d8e5;border-radius:8px;font:inherit;font-size:13px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid #c7d8e5;border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--navy);display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.chip.off{opacity:.4}
#count{font-size:11px;color:var(--mut);margin-top:8px}
#list{flex:1;overflow:auto}
.item{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid #eef3f7;cursor:pointer;font-size:12.5px}
.item:hover{background:var(--lb)}
.item .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.item .nm{flex:1;font-weight:600}.item .nm small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}
.item .sc{font-weight:800;background:var(--lb);border-radius:6px;padding:2px 8px;font-size:12px}
.item .ap{color:var(--mut);font-size:11px}
#map{flex:1}
.leaflet-popup-content{font-family:inherit;font-size:12.5px;line-height:1.45}.leaflet-popup-content b{font-size:14px}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700;margin-top:3px}
.note{color:#9a5b00;font-size:11px;margin-top:5px}
.legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);font-size:11px;line-height:1.6}

const COL={'Business Bay':'#ef6c4d','Downtown':'#0f3d64'};
const map=L.map('map',{zoomControl:true}).setView([25.1915,55.2705],14);
const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
L.control.layers({'Map':street,'Satellite':sat},null,{position:'topright'}).addTo(map);
const on={'Business Bay':true,'Downtown':true};
const layer=L.layerGroup().addTo(map);const markers=[];
T.forEach((t,i)=>{
  const r=5+t.screens*1.5;
  const m=L.circleMarker([t.lat,t.lng],{radius:r,color:COL[t.area],weight:t.approx?2:1.5,dashArray:t.approx?'3 3':null,fillColor:COL[t.area],fillOpacity:t.approx?.35:.65}).bindPopup(
   '<b>'+t.name+'</b><br>'+t.area+'<br><span class="pill">'+t.screens+' screen'+(t.screens>1?'s':'')+'</span>'+(t.note?'<div class="note">&#9888; '+t.note+'</div>':'')+'<div style="color:#5b7388;font-size:10.5px;margin-top:4px">Matched to: '+t.match+'</div>');
  m.bindTooltip(t.name+' ('+t.screens+')',{direction:'top',offset:[0,-r]});
  markers.push(m);t.m=m;t.i=i;
});
const bounds=L.latLngBounds(T.map(t=>[t.lat,t.lng]));map.fitBounds(bounds.pad(.08));

const list=document.getElementById('list'),q=document.getElementById('q');
function sum(a){return T.filter(t=>t.area===a).reduce((s,t)=>s+t.screens,0)}
document.getElementById('sBB').innerHTML=sum('Business Bay')+' <em>'+T.filter(t=>t.area==='Business Bay').length+' towers</em>';
document.getElementById('sDT').innerHTML=sum('Downtown')+' <em>'+T.filter(t=>t.area==='Downtown').length+' towers</em>';
function render(){
  const s=q.value.trim().toLowerCase();layer.clearLayers();list.innerHTML='';let n=0,sc=0;
  T.filter(t=>on[t.area]&&(!s||t.name.toLowerCase().includes(s))).forEach(t=>{
    layer.addLayer(t.m);n++;sc+=t.screens;
    const e=document.createElement('div');e.className='item';e.style.setProperty('--c',COL[t.area]);
    e.innerHTML='<span class="dot"></span><span class="nm">'+t.name+'<small>'+t.area+'</small></span>'+(t.approx?'<span class="ap" title="approximate position">&#9711;</span>':'')+'<span class="sc">'+t.screens+'</span>';
    e.onclick=()=>{map.setView([t.lat,t.lng],Math.max(map.getZoom(),17));t.m.openPopup()};list.appendChild(e);
  });
  document.getElementById('count').textContent=n+' towers shown - '+sc+' screens';
  document.getElementById('cBB').classList.toggle('off',!on['Business Bay']);document.getElementById('cDT').classList.toggle('off',!on['Downtown']);
}
document.getElementById('cBB').onclick=()=>{on['Business Bay']=!on['Business Bay'];render()};
document.getElementById('cDT').onclick=()=>{on['Downtown']=!on['Downtown'];render()};
q.oninput=render;render();
